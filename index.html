<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Markdown ke PDF - Konverter</title>
    <script src="https://cdn.jsdelivr.net/npm/marked@15.0.7/marked.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Fira+Code:wght@400;500&family=Merriweather:wght@400;700&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-primary: #0a0a0f;
            --bg-secondary: #12121a;
            --bg-card: #1a1a25;
            --bg-card-hover: #222233;
            --border-color: #2a2a3a;
            --border-hover: #3a3a50;
            --text-primary: #e8e8f0;
            --text-secondary: #a0a0b8;
            --text-muted: #6e6e88;
            --accent: #7c5cfc;
            --accent-light: #9b7eff;
            --accent-glow: rgba(124, 92, 252, 0.15);
            --success: #34d399;
            --error: #f87171;
            --radius: 14px;
            --radius-sm: 8px;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* ===== HEADER ===== */
        .header {
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border-color);
            padding: 0 32px;
            height: 64px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo-icon {
            width: 36px;
            height: 36px;
            background: var(--accent);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            box-shadow: 0 0 20px var(--accent-glow);
        }

        .logo-text {
            font-size: 18px;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .logo-text span {
            color: var(--accent-light);
        }

        .header-actions {
            display: flex;
            gap: 10px;
        }

        /* ===== BUTTONS ===== */
        .btn {
            padding: 9px 18px;
            border-radius: var(--radius-sm);
            font-family: 'Inter', sans-serif;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            border: none;
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .btn:hover {
            transform: translateY(-1px);
        }

        .btn:active {
            transform: translateY(0);
        }

        .btn-primary {
            background: var(--accent);
            color: #fff;
            box-shadow: 0 4px 16px rgba(124, 92, 252, 0.3);
        }

        .btn-primary:hover {
            background: var(--accent-light);
            box-shadow: 0 6px 24px rgba(124, 92, 252, 0.4);
        }

        .btn-secondary {
            background: var(--bg-card);
            color: var(--text-secondary);
            border: 1px solid var(--border-color);
        }

        .btn-secondary:hover {
            background: var(--bg-card-hover);
            border-color: var(--border-hover);
            color: var(--text-primary);
        }

        .btn-success {
            background: var(--success);
            color: #064e3b;
        }

        /* ===== TOOLBAR ===== */
        .toolbar {
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border-color);
            padding: 12px 32px;
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .toolbar-section {
            display: flex;
            align-items: center;
            gap: 8px;
            padding-right: 16px;
            border-right: 1px solid var(--border-color);
        }

        .toolbar-section:last-child {
            border-right: none;
            margin-left: auto;
        }

        .toolbar-label {
            font-size: 12px;
            color: var(--text-muted);
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        select {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            color: var(--text-secondary);
            padding: 7px 12px;
            border-radius: var(--radius-sm);
            font-family: 'Inter', sans-serif;
            font-size: 13px;
            cursor: pointer;
            outline: none;
            transition: border-color 0.2s;
        }

        select:hover, select:focus {
            border-color: var(--accent);
        }

        /* ===== MAIN LAYOUT ===== */
        .main {
            flex: 1;
            display: grid;
            grid-template-columns: 1fr 1fr;
            overflow: hidden;
        }

        /* ===== PANEL ===== */
        .panel {
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .panel-header {
            padding: 14px 24px;
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .panel-title {
            font-size: 13px;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.8px;
        }

        .panel-badge {
            font-size: 11px;
            padding: 3px 10px;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            color: var(--text-muted);
        }

        .panel-body {
            flex: 1;
            overflow-y: auto;
            position: relative;
        }

        .panel-divider {
            width: 1px;
            background: var(--border-color);
        }

        /* ===== EDITOR ===== */
        .editor {
            width: 100%;
            height: 100%;
            background: var(--bg-primary);
            color: var(--text-primary);
            border: none;
            outline: none;
            padding: 24px;
            font-family: 'Fira Code', 'Courier New', monospace;
            font-size: 14px;
            line-height: 1.7;
            resize: none;
            tab-size: 4;
        }

        .editor::placeholder {
            color: var(--text-muted);
        }

        /* ===== DROPZONE (shown when empty) ===== */
        .dropzone {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 16px;
            color: var(--text-muted);
            pointer-events: none;
        }

        .dropzone-icon {
            font-size: 48px;
            opacity: 0.5;
        }

        .dropzone-text {
            font-size: 15px;
            text-align: center;
            line-height: 1.6;
        }

        .dropzone-text .hint {
            font-size: 13px;
            opacity: 0.7;
            margin-top: 4px;
        }

        .editor:not(:placeholder-shown) ~ .dropzone {
            display: none;
        }

        /* ===== PREVIEW ===== */
        .preview {
            padding: 32px 40px;
            max-width: 820px;
            margin: 0 auto;
        }

        /* ===== SCROLLBAR ===== */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: #3a3a50;
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #4a4a60;
        }

        /* ===== TOAST ===== */
        .toast-container {
            position: fixed;
            bottom: 24px;
            right: 24px;
            z-index: 1000;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .toast {
            padding: 14px 22px;
            border-radius: var(--radius-sm);
            font-size: 14px;
            font-weight: 500;
            animation: slideIn 0.3s ease;
            backdrop-filter: blur(10px);
        }

        .toast.success {
            background: rgba(52, 211, 153, 0.15);
            border: 1px solid rgba(52, 211, 153, 0.3);
            color: var(--success);
        }

        .toast.error {
            background: rgba(248, 113, 113, 0.15);
            border: 1px solid rgba(248, 113, 113, 0.3);
            color: var(--error);
        }

        @keyframes slideIn {
            from { transform: translateX(100px); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }

        /* ===== DRAG OVERLAY ===== */
        .drag-overlay {
            position: fixed;
            inset: 0;
            background: rgba(10, 10, 15, 0.9);
            backdrop-filter: blur(8px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            flex-direction: column;
            gap: 20px;
        }

        .drag-overlay.active {
            display: flex;
        }

        .drag-overlay-icon {
            font-size: 64px;
        }

        .drag-overlay-text {
            font-size: 22px;
            font-weight: 600;
            color: var(--text-primary);
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 768px) {
            .main {
                grid-template-columns: 1fr;
                grid-template-rows: 1fr 1fr;
            }
            .panel-divider { display: none; }
            .toolbar { padding: 10px 16px; }
            .header { padding: 0 16px; }
        }

        /* ==================== PRINT STYLES ==================== */
        @media print {
            .no-print { display: none !important; }
            
            body {
                background: white !important;
                color: black !important;
            }

            .preview {
                padding: 0 !important;
                max-width: 100% !important;
            }
        }

        /* ==================== PREVIEW CONTENT STYLES ==================== */
        .preview-content {
            font-family: 'Merriweather', Georgia, serif;
            font-size: 15px;
            line-height: 1.8;
            color: #d4d4e0;
        }

        .preview-content h1 {
            font-family: 'Inter', sans-serif;
            font-size: 2.2em;
            font-weight: 700;
            color: #ffffff;
            margin: 0.6em 0 0.4em;
            padding-bottom: 0.3em;
            border-bottom: 2px solid #33334a;
            letter-spacing: -0.5px;
        }

        .preview-content h2 {
            font-family: 'Inter', sans-serif;
            font-size: 1.7em;
            font-weight: 700;
            color: #f0f0fa;
            margin: 1em 0 0.5em;
            padding-bottom: 0.3em;
            border-bottom: 1px solid #2a2a3e;
        }

        .preview-content h3 {
            font-family: 'Inter', sans-serif;
            font-size: 1.35em;
            font-weight: 600;
            color: #e8e8f5;
            margin: 1em 0 0.5em;
        }

        .preview-content h4 {
            font-family: 'Inter', sans-serif;
            font-size: 1.15em;
            font-weight: 600;
            color: #e0e0f0;
            margin: 1em 0 0.5em;
        }

        .preview-content h5, .preview-content h6 {
            font-family: 'Inter', sans-serif;
            font-size: 1em;
            font-weight: 600;
            color: #d0d0e0;
            margin: 1em 0 0.5em;
        }

        .preview-content p {
            margin: 0.8em 0;
        }

        .preview-content a {
            color: #9b7eff;
            text-decoration: none;
        }

        .preview-content a:hover {
            text-decoration: underline;
        }

        .preview-content strong {
            color: #ffffff;
            font-weight: 700;
        }

        .preview-content em {
            font-style: italic;
        }

        .preview-content code {
            font-family: 'Fira Code', 'Courier New', monospace;
            background: #252538;
            padding: 3px 8px;
            border-radius: 5px;
            font-size: 0.88em;
            color: #c4b5fd;
        }

        .preview-content pre {
            background: #151520;
            border: 1px solid #2a2a3e;
            border-radius: 10px;
            padding: 20px;
            overflow-x: auto;
            margin: 1em 0;
        }

        .preview-content pre code {
            background: none;
            padding: 0;
            color: #d4d4e0;
            font-size: 13px;
            line-height: 1.6;
        }

        .preview-content blockquote {
            border-left: 4px solid var(--accent);
            margin: 1em 0;
            padding: 12px 24px;
            background: var(--accent-glow);
            border-radius: 0 8px 8px 0;
            color: #c8c8e0;
        }

        .preview-content blockquote p:first-child {
            margin-top: 0;
        }

        .preview-content blockquote p:last-child {
            margin-bottom: 0;
        }

        .preview-content ul, .preview-content ol {
            margin: 0.8em 0;
            padding-left: 2em;
        }

        .preview-content li {
            margin: 0.4em 0;
        }

        .preview-content table {
            width: 100%;
            border-collapse: collapse;
            margin: 1em 0;
            font-size: 14px;
        }

        .preview-content th, .preview-content td {
            border: 1px solid #2a2a3e;
            padding: 10px 14px;
            text-align: left;
        }

        .preview-content th {
            background: #1e1e2e;
            font-weight: 600;
            color: #ffffff;
        }

        .preview-content tr:nth-child(even) {
            background: rgba(255,255,255,0.02);
        }

        .preview-content tr:hover {
            background: rgba(124, 92, 252, 0.05);
        }

        .preview-content img {
            max-width: 100%;
            height: auto;
            border-radius: 8px;
            margin: 1em 0;
        }

        .preview-content hr {
            border: none;
            border-top: 2px solid #33334a;
            margin: 2em 0;
        }

        .preview-content input[type="checkbox"] {
            margin-right: 8px;
        }

        .preview-content .contains-task-list {
            list-style: none;
            padding-left: 0;
        }

        .preview-content .task-list-item {
            display: flex;
            align-items: center;
            gap: 8px;
        }
    </style>
</head>
<body>
    <!-- Drag Overlay -->
    <div class="drag-overlay" id="dragOverlay">
        <div class="drag-overlay-icon">📁</div>
        <div class="drag-overlay-text">Drop file Markdown di sini</div>
    </div>

    <!-- Header -->
    <header class="header no-print">
        <div class="logo">
            <div class="logo-icon">M</div>
            <div class="logo-text">MD <span>2 PDF</span></div>
        </div>
        <div class="header-actions">
            <input type="file" id="fileInput" accept=".md,.markdown,.txt" style="display: none;">
            <button class="btn btn-secondary" onclick="document.getElementById('fileInput').click()">
                📂 Buka File
            </button>
            <button class="btn btn-primary" onclick="exportPDF()">
                📄 Export PDF
            </button>
        </div>
    </header>

    <!-- Toolbar -->
    <div class="toolbar no-print">
        <div class="toolbar-section">
            <span class="toolbar-label">Kertas</span>
            <select id="paperSize" onchange="updatePaperSize()">
                <option value="A4">A4</option>
                <option value="Letter">Letter</option>
                <option value="Legal">Legal</option>
            </select>
        </div>
        <div class="toolbar-section">
            <span class="toolbar-label">Font</span>
            <select id="fontFamily" onchange="updateFont()">
                <option value="Merriweather">Merriweather (Serif)</option>
                <option value="Inter">Inter (Sans-serif)</option>
                <option value="Fira Code">Fira Code (Monospace)</option>
            </select>
        </div>
        <div class="toolbar-section">
            <span class="toolbar-label">Tema</span>
            <select id="theme" onchange="updateTheme()">
                <option value="dark">Dark (Preview)</option>
                <option value="light">Light (Print)</option>
            </select>
        </div>
        <div class="toolbar-section">
            <button class="btn btn-secondary" onclick="loadExample()" style="font-size: 13px; padding: 7px 14px;">
                ✨ Contoh
            </button>
            <button class="btn btn-secondary" onclick="clearAll()" style="font-size: 13px; padding: 7px 14px;">
                🗑️ Hapus
            </button>
        </div>
    </div>

    <!-- Main -->
    <div class="main no-print">
        <!-- Editor Panel -->
        <div class="panel">
            <div class="panel-header">
                <span class="panel-title">Markdown</span>
                <span class="panel-badge" id="charCount">0 karakter</span>
            </div>
            <div class="panel-body">
                <textarea 
                    class="editor" 
                    id="editor" 
                    placeholder="# Tulis Markdown di sini..."
                    spellcheck="false"
                ></textarea>
                <div class="dropzone">
                    <div class="dropzone-icon">📝</div>
                    <div class="dropzone-text">
                        <strong>Tulis atau paste Markdown di sini</strong>
                        <div class="hint">Bisa juga drag & drop file .md langsung ke sini</div>
                    </div>
                </div>
            </div>
        </div>

        <div class="panel-divider"></div>

        <!-- Preview Panel -->
        <div class="panel">
            <div class="panel-header">
                <span class="panel-title">Preview</span>
                <span class="panel-badge">Live</span>
            </div>
            <div class="panel-body">
                <div class="preview" id="preview">
                    <div class="preview-content" id="previewContent">
                        <p style="color: var(--text-muted); text-align: center; margin-top: 40px;">
                            Preview akan muncul di sini...
                        </p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Print Area (hidden in normal view) -->
    <div id="printArea" style="display: none;">
        <div id="printContent"></div>
    </div>

    <!-- Toast Container -->
    <div class="toast-container no-print" id="toastContainer"></div>

    <script>
        // ===== Elements =====
        const editor = document.getElementById('editor');
        const previewContent = document.getElementById('previewContent');
        const fileInput = document.getElementById('fileInput');
        const dragOverlay = document.getElementById('dragOverlay');
        const charCount = document.getElementById('charCount');
        const toastContainer = document.getElementById('toastContainer');

        // ===== State =====
        let currentPaperSize = 'A4';
        let currentFont = 'Merriweather';
        let currentTheme = 'dark';

        // ===== Initialize =====
        marked.setOptions({
            breaks: true,
            gfm: true,
            headerIds: true
        });

        // ===== Live Preview =====
        editor.addEventListener('input', updatePreview);

        function updatePreview() {
            const text = editor.value;
            const html = marked.parse(text);
            previewContent.innerHTML = html || '<p style="color: var(--text-muted); text-align: center; margin-top: 40px;">Preview akan muncul di sini...</p>';
            charCount.textContent = `${text.length.toLocaleString()} karakter | ${text.split(/\s+/).filter(w => w.length > 0).length.toLocaleString()} kata`;
        }

        // ===== File Upload =====
        fileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) readFile(file);
        });

        function readFile(file) {
            const reader = new FileReader();
            reader.onload = (e) => {
                editor.value = e.target.result;
                updatePreview();
                showToast(`Berhasil membaca "${file.name}"`, 'success');
            };
            reader.onerror = () => {
                showToast('Gagal membaca file', 'error');
            };
            reader.readAsText(file);
        }

        // ===== Drag & Drop =====
        ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
            document.body.addEventListener(eventName, preventDefaults, false);
        });

        function preventDefaults(e) {
            e.preventDefault();
            e.stopPropagation();
        }

        document.body.addEventListener('dragenter', () => dragOverlay.classList.add('active'));
        dragOverlay.addEventListener('dragleave', (e) => {
            if (e.target === dragOverlay) dragOverlay.classList.remove('active');
        });
        dragOverlay.addEventListener('drop', (e) => {
            dragOverlay.classList.remove('active');
            const files = e.dataTransfer.files;
            if (files.length > 0) readFile(files[0]);
        });

        // ===== Export PDF =====
        function exportPDF() {
            if (!editor.value.trim()) {
                showToast('Tidak ada konten untuk di-export!', 'error');
                return;
            }

            const printContent = document.getElementById('printContent');
            const html = marked.parse(editor.value);
            
            // Build print-friendly HTML
            const paperSizes = {
                'A4': '210mm 297mm',
                'Letter': '8.5in 11in',
                'Legal': '8.5in 14in'
            };

            const printHTML = `
                <!DOCTYPE html>
                <html>
                <head>
                    <meta charset="utf-8">
                    <title>Exported PDF</title>
                    <link href="https://fonts.googleapis.com/css2?family=${currentFont === 'Fira Code' ? 'Fira+Code' : currentFont === 'Inter' ? 'Inter' : 'Merriweather'}:wght@400;700&family=Fira+Code:wght@400&display=swap" rel="stylesheet">
                    <style>
                        @page {
                            size: ${paperSizes[currentPaperSize]};
                            margin: 20mm;
                        }
                        * { box-sizing: border-box; }
                        body {
                            font-family: '${currentFont}', Georgia, serif;
                            font-size: 11pt;
                            line-height: 1.7;
                            color: #222;
                            margin: 0;
                            padding: 0;
                        }
                        h1 {
                            font-size: 2em;
                            font-weight: 700;
                            margin: 0.5em 0 0.3em;
                            padding-bottom: 0.2em;
                            border-bottom: 2px solid #ddd;
                            color: #111;
                        }
                        h2 {
                            font-size: 1.6em;
                            font-weight: 700;
                            margin: 0.8em 0 0.4em;
                            padding-bottom: 0.2em;
                            border-bottom: 1px solid #e5e5e5;
                            color: #222;
                        }
                        h3 { font-size: 1.3em; font-weight: 700; margin: 0.8em 0 0.4em; color: #333; }
                        h4 { font-size: 1.1em; font-weight: 700; margin: 0.8em 0 0.4em; color: #444; }
                        h5, h6 { font-size: 1em; font-weight: 700; margin: 0.8em 0 0.4em; color: #555; }
                        p { margin: 0.6em 0; }
                        a { color: #2563eb; text-decoration: none; }
                        strong { font-weight: 700; }
                        code {
                            font-family: 'Fira Code', monospace;
                            background: #f1f5f9;
                            padding: 2px 6px;
                            border-radius: 4px;
                            font-size: 0.9em;
                            color: #7c3aed;
                        }
                        pre {
                            background: #f8fafc;
                            border: 1px solid #e2e8f0;
                            border-radius: 8px;
                            padding: 16px;
                            overflow-x: auto;
                            margin: 0.8em 0;
                        }
                        pre code {
                            background: none;
                            padding: 0;
                            color: #334155;
                            font-size: 9.5pt;
                        }
                        blockquote {
                            border-left: 4px solid #7c5cfc;
                            margin: 0.8em 0;
                            padding: 10px 20px;
                            background: #faf8ff;
                            border-radius: 0 6px 6px 0;
                            color: #555;
                        }
                        blockquote p { margin: 0.3em 0; }
                        ul, ol { margin: 0.6em 0; padding-left: 2em; }
                        li { margin: 0.3em 0; }
                        table {
                            width: 100%;
                            border-collapse: collapse;
                            margin: 0.8em 0;
                            font-size: 10pt;
                        }
                        th, td {
                            border: 1px solid #d1d5db;
                            padding: 8px 12px;
                            text-align: left;
                        }
                        th {
                            background: #f3f4f6;
                            font-weight: 600;
                        }
                        tr:nth-child(even) { background: #fafafa; }
                        img {
                            max-width: 100%;
                            height: auto;
                            border-radius: 6px;
                        }
                        hr {
                            border: none;
                            border-top: 1.5px solid #e5e5e5;
                            margin: 1.5em 0;
                        }
                        .contains-task-list { list-style: none; padding-left: 0; }
                        .task-list-item { display: flex; align-items: center; gap: 6px; }
                    </style>
                </head>
                <body>
                    ${html}
                </body>
                </html>
            `;

            printContent.innerHTML = printHTML;

            // Open print dialog
            const printWindow = window.open('', '_blank');
            printWindow.document.write(printHTML);
            printWindow.document.close();
            
            // Wait for fonts then print
            setTimeout(() => {
                printWindow.print();
                // printWindow.close(); // Optional: close after print
            }, 500);

            showToast('Dialog print dibuka! Pilih "Save as PDF"', 'success');
        }

        // ===== Toolbar Functions =====
        function updatePaperSize() {
            currentPaperSize = document.getElementById('paperSize').value;
            showToast(`Ukuran kertas: ${currentPaperSize}`, 'success');
        }

        function updateFont() {
            currentFont = document.getElementById('fontFamily').value;
            previewContent.style.fontFamily = currentFont === 'Inter' ? 'Inter, sans-serif' : currentFont === 'Fira Code' ? 'Fira Code, monospace' : "'Merriweather', Georgia, serif";
            showToast(`Font: ${currentFont}`, 'success');
        }

        function updateTheme() {
            currentTheme = document.getElementById('theme').value;
            if (currentTheme === 'light') {
                document.documentElement.style.setProperty('--bg-primary', '#fafafa');
                document.documentElement.style.setProperty('--bg-secondary', '#f0f0f5');
                document.documentElement.style.setProperty('--bg-card', '#e8e8f0');
                document.documentElement.style.setProperty('--bg-card-hover', '#dddde5');
                document.documentElement.style.setProperty('--border-color', '#d0d0d8');
                document.documentElement.style.setProperty('--text-primary', '#1a1a2e');
                document.documentElement.style.setProperty('--text-secondary', '#4a4a5e');
                document.documentElement.style.setProperty('--text-muted', '#7a7a8e');
                editor.style.background = '#fafafa';
                editor.style.color = '#1a1a2e';
                previewContent.style.color = '#33334a';
            } else {
                document.documentElement.style.setProperty('--bg-primary', '#0a0a0f');
                document.documentElement.style.setProperty('--bg-secondary', '#12121a');
                document.documentElement.style.setProperty('--bg-card', '#1a1a25');
                document.documentElement.style.setProperty('--bg-card-hover', '#222233');
                document.documentElement.style.setProperty('--border-color', '#2a2a3a');
                document.documentElement.style.setProperty('--text-primary', '#e8e8f0');
                document.documentElement.style.setProperty('--text-secondary', '#a0a0b8');
                document.documentElement.style.setProperty('--text-muted', '#6e6e88');
                editor.style.background = '#0a0a0f';
                editor.style.color = '#e8e8f0';
                previewContent.style.color = '#d4d4e0';
            }
        }

        function loadExample() {
            editor.value = `# Panduan Pengguna MD2PDF

            updatePreview();
            showToast('Contoh dimuat!', 'success');
        }

        function clearAll() {
            if (editor.value && !confirm('Yakin ingin menghapus semua konten?')) return;
            editor.value = '';
            updatePreview();
            showToast('Editor dikosongkan', 'success');
        }

        // ===== Toast =====
        function showToast(message, type = 'success') {
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            toast.textContent = message;
            toastContainer.appendChild(toast);
            
            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transform = 'translateX(100px)';
                toast.style.transition = 'all 0.3s ease';
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        // ===== Keyboard Shortcuts =====
        editor.addEventListener('keydown', (e) => {
            if (e.key === 'Tab') {
                e.preventDefault();
                const start = editor.selectionStart;
                const end = editor.selectionEnd;
                editor.value = editor.value.substring(0, start) + '    ' + editor.value.substring(end);
                editor.selectionStart = editor.selectionEnd = start + 4;
            }
        });

        document.addEventListener('keydown', (e) => {
            if ((e.ctrlKey || e.metaKey) && e.key === 'p') {
                e.preventDefault();
                exportPDF();
            }
            if ((e.ctrlKey || e.metaKey) && e.key === 'o') {
                e.preventDefault();
                document.getElementById('fileInput').click();
            }
        });

        // Auto-load example on first visit
        if (!editor.value) {
            loadExample();
        }
    </script>
</body>
